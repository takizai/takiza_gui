[package]
name = "takiza-gui"
version = "0.2.1"
description = "Takiza Code desktop AI coding agent"
authors = ["Takiza contributors"]
homepage = "https://github.com/takizai/takiza_gui"
repository = "https://github.com/takizai/takiza_gui"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-opener = "=2.5.5"
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dotenvy = "0.15"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
quick-xml = { version = "0.42", features = ["serialize"] }
chrono = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
